name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin (TypeScript → JS)
        run: npm run build

      - name: Verify standalone MCP package
        run: npm run test:mcp

      - name: Audit standalone MCP package
        run: |
          npm ci --prefix mcp --ignore-scripts
          npm audit --prefix mcp --omit=dev

      - name: Run unit + plugin tests (Jest)
        run: |
          npm install --no-save jest-junit
          node --experimental-vm-modules node_modules/.bin/jest \
            --testPathPatterns='tests/unit|plugins' \
            --testPathIgnorePatterns='security\.test|tabRecycling\.test|cookies\.test' \
            --forceExit
        env:
          CI: true


  windows-process-cleanup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save jest-junit

      - name: Verify Windows process cleanup
        shell: pwsh
        run: |
          $env:NODE_OPTIONS = '--experimental-vm-modules'
          npx jest --runInBand --forceExit tests/unit/windowsProcesses.test.js
        env:
          CI: true

  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save jest-junit

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox

      - name: Install browser system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox

      - name: Run e2e + browser-dependent unit tests
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --config jest.config.e2e.cjs \
              --runInBand --forceExit
        env:
          CI: true

      - name: Run browser-dependent unit tests
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --testPathPatterns='tests/unit/(security|tabRecycling|cookies)\.test' \
              --runInBand --forceExit
        env:
          CI: true

  notify-agenthook:
    needs: [unit, windows-process-cleanup, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify agenthook
        env:
          AGENTHOOK_URL: ${{ secrets.AGENTHOOK_URL }}
          AGENTHOOK_TOKEN: ${{ secrets.AGENTHOOK_TOKEN }}
          AGENTHOOK_TOPIC: ${{ secrets.AGENTHOOK_TOPIC }}
          STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          RESULTS: ${{ toJson(needs) }}
        run: |
          curl --fail --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer ${AGENTHOOK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$(jq -nc \
              --arg status "$STATUS" \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg branch "$GITHUB_REF_NAME" \
              --arg sha "$GITHUB_SHA" \
              --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --argjson results "$RESULTS" \
              '{kind:"ci",status:$status,repository:$repo,branch:$branch,sha:$sha,run_url:$run_url,results:$results}')" \
            "${AGENTHOOK_URL}/v1/webhooks/${AGENTHOOK_TOPIC}"
