name: Publish to ClawHub

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  dry-run:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Checkout ClawHub CLI
        uses: actions/checkout@v4
        with:
          repository: openclaw/clawhub
          # Pinned: this tooling runs with publish credentials in scope. SHA is
          # openclaw/clawhub main as of 2026-10-19; bump deliberately.
          ref: 433251e124a6ec0c5fef5dee05a64c1603a75344
          path: clawhub-source

      - name: Build ClawHub CLI
        working-directory: clawhub-source
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/clawhub build

      - name: Validate plugin with Node.js
        run: |
          node clawhub-source/packages/clawhub/bin/clawdhub.js package validate . --out "$RUNNER_TEMP/plugin-inspector"

      - name: Dry-run package publish with Node.js
        run: |
          node clawhub-source/packages/clawhub/bin/clawdhub.js package publish \
            "$GITHUB_REPOSITORY@$GITHUB_SHA" \
            --site https://clawhub.ai \
            --registry https://clawhub.ai \
            --dry-run --json --tags latest --source-ref "$GITHUB_REF"

      - name: Upload plugin inspector reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-inspector-report
          path: ${{ runner.temp }}/plugin-inspector
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Checkout ClawHub CLI
        uses: actions/checkout@v4
        with:
          repository: openclaw/clawhub
          # Pinned: this tooling runs with publish credentials in scope. SHA is
          # openclaw/clawhub main as of 2026-10-19; bump deliberately.
          ref: 433251e124a6ec0c5fef5dee05a64c1603a75344
          path: clawhub-source

      - name: Build ClawHub CLI
        working-directory: clawhub-source
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/clawhub build

      - name: Validate plugin with Node.js
        run: |
          node clawhub-source/packages/clawhub/bin/clawdhub.js package validate . --out "$RUNNER_TEMP/plugin-inspector"

      - name: Configure ClawHub credentials
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const token = process.env.CLAWHUB_TOKEN;
          if (!token) throw new Error('CLAWHUB_TOKEN is required for a real publish');
          const path = `${process.env.RUNNER_TEMP}/clawhub-config.json`;
          writeFileSync(path, JSON.stringify({ registry: 'https://clawhub.ai', token }) + '\n', { mode: 0o600 });
          console.log(`CLAWHUB_CONFIG_PATH=${path}`);
          NODE
          echo "CLAWHUB_CONFIG_PATH=$RUNNER_TEMP/clawhub-config.json" >> "$GITHUB_ENV"

      - name: Publish package with Node.js
        run: |
          node clawhub-source/packages/clawhub/bin/clawdhub.js package publish \
            "$GITHUB_REPOSITORY@$GITHUB_SHA" \
            --site https://clawhub.ai \
            --registry https://clawhub.ai \
            --json --tags latest --source-ref "$GITHUB_REF" \
            --manual-override-reason "GitHub Actions $GITHUB_EVENT_NAME publish via CLAWHUB_TOKEN" \
            --wait --wait-timeout 1800

      - name: Upload plugin inspector reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-inspector-report
          path: ${{ runner.temp }}/plugin-inspector
          if-no-files-found: ignore

  notify-agenthook:
    needs: [dry-run, publish]
    if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    uses: ./.github/workflows/agenthook-notify.yml
    with:
      kind: release
      results: ${{ toJson(needs) }}
    secrets: inherit
