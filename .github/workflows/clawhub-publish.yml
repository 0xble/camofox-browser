name: Publish to ClawHub

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  dry-run:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Checkout ClawHub CLI
        uses: actions/checkout@v4
        with:
          repository: openclaw/clawhub
          path: clawhub-source

      - name: Build ClawHub CLI
        working-directory: clawhub-source
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/clawhub build

      - name: Validate plugin with Node.js
        run: |
          node clawhub-source/packages/clawhub/bin/clawdhub.js package validate . --out "$RUNNER_TEMP/plugin-inspector"

      - name: Dry-run package publish with Node.js
        run: |
          node clawhub-source/packages/clawhub/bin/clawdhub.js package publish \
            "$GITHUB_REPOSITORY@$GITHUB_SHA" \
            --site https://clawhub.ai \
            --registry https://clawhub.ai \
            --dry-run --json --tags latest --source-ref "$GITHUB_REF"

      - name: Upload plugin inspector reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-inspector-report
          path: ${{ runner.temp }}/plugin-inspector
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@main
    with:
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  notify-agenthook:
    needs: [dry-run, publish]
    if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    uses: ./.github/workflows/agenthook-notify.yml
    with:
      kind: release
      results: ${{ toJson(needs) }}
    secrets: inherit
